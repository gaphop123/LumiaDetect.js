<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LumiaDetect.js Demo</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #e2e8f0;
      min-height: 100vh;
      padding: 24px;
    }
    .container { max-width: 720px; margin: 0 auto; }
    h1 {
      font-size: 1.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      color: #38bdf8;
    }
    .subtitle { color: #94a3b8; margin-bottom: 24px; font-size: 0.95rem; }
    .card {
      background: #1e293b;
      border-radius: 12px;
      padding: 20px;
      margin-bottom: 16px;
      border: 1px solid #334155;
    }
    .card h2 {
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      color: #64748b;
      margin-bottom: 12px;
    }
    .row {
      display: flex;
      justify-content: space-between;
      padding: 8px 0;
      border-bottom: 1px solid #334155;
    }
    .row:last-child { border-bottom: none; }
    .label { color: #94a3b8; }
    .value { font-weight: 600; color: #f1f5f9; text-align: right; max-width: 60%; word-break: break-all; }
    .value.true { color: #4ade80; }
    .value.false { color: #f87171; }
    .value.null { color: #64748b; }
    .btn {
      display: inline-block;
      background: #0ea5e9;
      color: #fff;
      border: none;
      padding: 12px 28px;
      border-radius: 8px;
      font-size: 1rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn:hover { background: #0284c7; }
    .btn:active { transform: scale(0.98); }
    .status {
      display: inline-block;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 0.8rem;
      font-weight: 600;
    }
    .status.lumia { background: #166534; color: #bbf7d0; }
    .status.not-lumia { background: #7f1d1d; color: #fecaca; }
    .ua-box {
      background: #0f172a;
      border-radius: 8px;
      padding: 12px;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 0.8rem;
      word-break: break-all;
      color: #94a3b8;
      margin-top: 8px;
    }
    .footer {
      text-align: center;
      color: #64748b;
      font-size: 0.8rem;
      margin-top: 32px;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>LumiaDetect.js</h1>
    <p class="subtitle">Microsoft Lumia / Windows Phone device detection</p>

    <div class="card">
      <button class="btn" id="detectBtn">Detect</button>
      <span id="statusBadge" class="status not-lumia" style="margin-left:12px;">Not detected</span>
    </div>

    <div class="card">
      <h2>Detection Result</h2>
      <div class="row"><span class="label">Lumia detected</span><span class="value" id="isLumia">—</span></div>
      <div class="row"><span class="label">Windows Phone</span><span class="value" id="isWP">—</span></div>
      <div class="row"><span class="label">Model</span><span class="value" id="model">—</span></div>
      <div class="row"><span class="label">Series</span><span class="value" id="series">—</span></div>
      <div class="row"><span class="label">Manufacturer</span><span class="value" id="manufacturer">—</span></div>
      <div class="row"><span class="label">OS</span><span class="value" id="os">—</span></div>
      <div class="row"><span class="label">OS Version</span><span class="value" id="osVersion">—</span></div>
      <div class="row"><span class="label">Confidence</span><span class="value" id="confidence">—</span></div>
      <div class="row"><span class="label">Matched Pattern</span><span class="value" id="matched">—</span></div>
    </div>

    <div class="card">
      <h2>Environment</h2>
      <div class="row"><span class="label">Platform</span><span class="value" id="platform">—</span></div>
      <div class="row">
        <span class="label">User Agent</span>
      </div>
      <div class="ua-box" id="userAgent">—</div>
    </div>

    <p class="footer">LumiaDetect.js v1.0.0 · Zero dependency · MIT License</p>
  </div>

  <script src="../dist/LumiaDetect.js"></script>
  <script>
    function setVal(id, val) {
      var el = document.getElementById(id);
      if (val === true) {
        el.textContent = "true";
        el.className = "value true";
      } else if (val === false) {
        el.textContent = "false";
        el.className = "value false";
      } else if (val == null) {
        el.textContent = "null";
        el.className = "value null";
      } else {
        el.textContent = String(val);
        el.className = "value";
      }
    }

    function render(info) {
      setVal("isLumia", info.isLumia);
      setVal("isWP", info.isWindowsPhone);
      setVal("model", info.model);
      setVal("series", info.series);
      setVal("manufacturer", info.manufacturer);
      setVal("os", info.os);
      setVal("osVersion", info.osVersion);
      setVal("confidence", info.confidence);
      setVal("matched", info.matchedPattern);
      setVal("platform", info.platform);
      document.getElementById("userAgent").textContent = info.userAgent || "—";

      var badge = document.getElementById("statusBadge");
      if (info.isLumia) {
        badge.textContent = "Lumia detected";
        badge.className = "status lumia";
      } else {
        badge.textContent = "Not a Lumia";
        badge.className = "status not-lumia";
      }
    }

    document.getElementById("detectBtn").addEventListener("click", function () {
      LumiaDetect.detect(function (info) {
        render(info);
      }, function (err) {
        console.error("Detection error:", err);
        alert("Detection failed: " + (err && err.message ? err.message : err));
      });
    });

    // Auto-detect on load
    LumiaDetect.detect(function (info) {
      render(info);
    });
  </script>
</body>
</html>
